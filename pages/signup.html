<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Ink &amp; Imagination</title>
  <meta name="description" content="Create your Ink & Imagination studio account.">
  <link rel="icon" type="image/svg+xml" href="../images/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../images/apple-touch-icon.png">
  <link rel="stylesheet" href="../css/main.css?v=25">
  <link rel="stylesheet" href="../css/components.css?v=25">
</head>
<body class="auth-minimal auth-signup">
  <div class="auth-toggles" role="group" aria-label="Display preferences">
    <button type="button" id="theme-toggle" class="toggle-pill" aria-label="Toggle dark mode"><span data-theme-icon aria-hidden="true"></span><span data-theme-label>Light</span></button>
    <button type="button" id="dir-toggle" class="toggle-pill" aria-label="Toggle layout direction"><span data-dir-label>LTR</span></button>
  </div>
  <main class="auth-card" data-reveal>
    <a href="../index.html" class="auth-brand" aria-label="Ink and Imagination home">
      <img class="auth-brand-mark" src="../images/logo.svg" alt="Ink and Imagination logo">
      <span class="auth-brand-name">Ink &amp; Imagination</span>
      <span class="auth-brand-tagline">Handcrafted Stationery Studio</span>
    </a>
    <h1 class="auth-title">Sign Up</h1>
    <p class="auth-sub">One account for faster enquiries and proof updates.</p>
    <div data-auth-state></div>
    <form id="signup-form" data-validate novalidate>
      <div class="field"><label for="su-name">Full name *</label><input id="su-name" name="name" type="text" required minlength="2" placeholder="Your name" autocomplete="name"><span class="err"></span></div>
      <div class="field" style="margin-top:.8rem;"><label for="su-email">Email *</label><input id="su-email" name="email" type="email" required placeholder="you@example.com" autocomplete="email"><span class="err"></span></div>
      <div class="field" style="margin-top:.8rem;"><label for="su-pass">Password *</label><div style="display:flex;gap:.5rem;"><input id="su-pass" name="password" type="password" required minlength="6" placeholder="Min. 6 characters" autocomplete="new-password" style="flex:1;"><button type="button" class="btn btn-outline btn-sm" data-show-pass="su-pass">Show</button></div><span class="err"></span></div>
      <div class="field" style="margin-top:.8rem;"><label for="su-pass2">Confirm password *</label><input id="su-pass2" name="confirm" type="password" required minlength="6" placeholder="Repeat password" autocomplete="new-password"><span class="err"></span></div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:1rem;">Create Account →</button>
    </form>
    <div class="auth-divider" aria-hidden="true"><span>or</span></div>
    <button type="button" class="social-btn" data-social="google">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
      Continue with Google
    </button>
    <button type="button" class="social-btn" data-social="facebook">
      <svg viewBox="0 0 24 24" fill="#1877F2" aria-hidden="true"><path d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.09 10.13 24v-8.44H7.08v-3.49h3.04V9.41c0-3.02 1.8-4.7 4.54-4.7 1.31 0 2.68.24 2.68.24v2.97h-1.5c-1.5 0-1.96.93-1.96 1.89v2.26h3.32l-.53 3.49h-2.8V24C19.62 23.1 24 18.1 24 12.07z"/></svg>
      Continue with Facebook
    </button>
    <p class="auth-switch">Already have an account? <a href="login.html">Login →</a></p>
    <a class="auth-back" href="../index.html">← Back to home</a>
  </main>

  <script src="../js/main.js?v=25"></script>
</body>
</html>
