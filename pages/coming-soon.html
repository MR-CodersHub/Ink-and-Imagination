<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon — New Collection | Ink &amp; Imagination</title>
  <meta name="description" content="New botanical collection pressing now. Get notified at launch.">
  <link rel="icon" type="image/svg+xml" href="../images/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../images/apple-touch-icon.png">
  <link rel="stylesheet" href="../css/main.css?v=25">
  <link rel="stylesheet" href="../css/components.css?v=25">
</head>
<body class="auth-minimal">
  <div class="auth-toggles" role="group" aria-label="Display preferences">
    <button type="button" id="theme-toggle" class="toggle-pill" aria-label="Toggle dark mode"><span data-theme-icon aria-hidden="true"></span><span data-theme-label>Light</span></button>
    <button type="button" id="dir-toggle" class="toggle-pill" aria-label="Toggle layout direction"><span data-dir-label>LTR</span></button>
  </div>
  <main class="auth-card" id="main-content" data-reveal>
    <a href="../index.html" class="auth-brand" aria-label="Ink and Imagination home">
      <img class="auth-brand-mark" src="../images/logo.svg" alt="Ink and Imagination logo">
      <span class="auth-brand-name">Ink &amp; Imagination</span>
      <span class="auth-brand-tagline">Handcrafted Stationery Studio</span>
    </a>
    <div class="section-tag-gold">SEASONAL PRESS • 2026</div>
    <h1 class="auth-title">New Collection Pressing Now</h1>
    <p class="auth-sub">Marigold-gold Diwali cards + pine-rose Christmas suites. Leave your email for a VIP invite.</p>
    <div id="countdown-timer" class="count-grid" style="margin-bottom:1.2rem;">
      <div class="count-box"><strong id="cd-days">45</strong><small>Days</small></div>
      <div class="count-box"><strong id="cd-hours">18</strong><small>Hours</small></div>
      <div class="count-box"><strong id="cd-mins">24</strong><small>Mins</small></div>
      <div class="count-box"><strong id="cd-secs">09</strong><small>Secs</small></div>
    </div>
    <form id="notify-form" data-validate novalidate style="text-align:left;">
      <div class="field"><label for="nt-email">Email *</label><input id="nt-email" name="email" type="email" required placeholder="you@example.com" autocomplete="email"><span class="err"></span></div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:.8rem;">Notify Me →</button>
    </form>
    <a class="auth-back" href="../index.html">← Back to home</a>
  </main>

  <script src="../js/main.js?v=25"></script>
</body>
</html>
